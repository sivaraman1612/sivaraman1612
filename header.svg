<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- animated waves -->
  <path fill="#ffffff" fill-opacity="0.06" d="M0,160 C150,120 350,200 500,160 C650,120 850,200 1000,160 L1000,220 L0,220 Z">
    <animateTransform attributeName="transform" type="translate" values="0,0; -60,6; 0,0" dur="6s" repeatCount="indefinite"/>
  </path>
  <path fill="#36BCF7" fill-opacity="0.10" d="M0,180 C200,140 300,210 500,180 C700,150 800,210 1000,180 L1000,220 L0,220 Z">
    <animateTransform attributeName="transform" type="translate" values="0,0; 50,-6; 0,0" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- floating dots -->
  <circle cx="120" cy="50" r="3" fill="#36BCF7" opacity="0.7">
    <animate attributeName="cy" values="50;35;50" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="70" r="4" fill="#ffffff" opacity="0.5">
    <animate attributeName="cy" values="70;55;70" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="30" r="2.5" fill="#36BCF7" opacity="0.7">
    <animate attributeName="cy" values="30;45;30" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- title -->
  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff">
    Sivaraman P
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- subtitle -->
  <text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#36BCF7" letter-spacing="2">
    Computer Science (AI &amp; ML) Student
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2.5s" fill="freeze"/>
  </text>
</svg>
